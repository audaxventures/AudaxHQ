name: Daily Brief

# Hourly trigger for the Daily Brief email (see
# src/app/api/cron/daily-brief/route.ts). This app has no cron of its own
# and Vercel's free tier only allows a once-daily invocation — hitting the
# route hourly instead lets it check every business's own timezone and only
# actually send once it's past that business's configured morning hour,
# without needing a paid Vercel plan. GitHub's schedule trigger is
# best-effort under load: in practice it doesn't just slip by a few minutes,
# it can skip whole hours (observed gaps between consecutive runs of 2-8+
# hours instead of the configured 1). listBusinessesDueForDailyBrief is
# written to tolerate that (see its comment) — it catches up on the next run
# rather than requiring an exact-hour hit — so a business is never
# permanently skipped for the day just because its one matching hour didn't
# fire.
#
# Requires two repo secrets (Settings > Secrets and variables > Actions):
#   APP_BASE_URL           e.g. https://app.verclara.io
#   DAILY_BRIEF_CRON_SECRET  same value as the DAILY_BRIEF_CRON_SECRET env
#                            var set on the Vercel deployment

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call the Daily Brief cron route
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.DAILY_BRIEF_CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/daily-brief"
